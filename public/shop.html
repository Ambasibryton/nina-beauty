 <!DOCTYPE html>
 <html lang='en'>
    <head>
        <meta charset='UTF-8'>
        <meta name='viewport' content='width=device-width,initial-scale=1.0'>
        <title>Shop | RINA</title>
        <link href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap' rel='stylesheet'>
        <link rel='stylesheet' href='/css/style.css'>
         <link rel='manifest' href='/manifest.json'>
         <meta name='theme-color' content='#1E1B18'>
         <link rel='apple-touch-icon' href='/images/icon-192.png'>
    </head>
    <body>
        <header>
            <div class='nav-inner'>
                <a href='/index.html' class='logo'>RINA</a>
                <nav>
                    <a href='/index.html'>Home</a>
                    <a href='/shop.html' class='active'>Shop</a>
                    <a href='/about.html'>About</a>
                    <a href='/contact.html'>Contact</a>
                </nav>
                <a href='/cart.html' class='cart-link'>Bag (<span id='cart-count'>0</span>)</a>
            </div>
        </header>
        <section class='container'>
            <h1 style='font-size:2.6rem;margin-bottom:16px;'>Shop RINA</h1>
            <div class='filters'>
                <button class='filter-btn active' onclick='setCat("All",this)'>All</button>
                <button class='filter-btn' onclick='setCat("Skincare",this)'>Skincare</button>
                <button class="filter-btn" onclick="setCat('Makeup', this)">Makeup</button>
                <button class='filter-btn' onclick='setCat("Body",this)'>Body</button>
            </div>
            <div class='grid' id='shop-grid'></div>
        </section>
        <footer>
            <p>&copy; 2026 RINA Cosmetics</p>
        </footer>
        <script src='/js/products.js'></script>
        <script src='/js/cart.js'></script>
        <script>
            var selVar={};
            window.RINA_PRODUCTS.forEach(function(p){
                selVar[p.id]=0;
            });
            var currentCat='All';
            function setCat(c,btn){
                currentCat=c;
                document.querySelectorAll('.filter-btn').forEach(function(b){
                    b.classList.remove('active');
                });
                btn.classList.add('active');
                renderShop();
            }
            function pickSwatch(pid,idx){
                selVar[pid]=idx;
                renderShop();
            }
            function renderShop(){
                var list=currentCat==='All'?window.RINA_PRODUCTS:window.RINA_PRODUCTS.filter(function(p){
                    return p.category===currentCat;
                });
                document.getElementById('shop-grid').innerHTML=list.map(function(p){
                    var vi=selVar[p.id];
                    var v=p.variants[vi];
                    var sw=p.variants.map(function(x,i){
                        return '<button class="swatch '+(i===vi?'active':'')+'" style="background:'+x.color+'" title="'+x.label+'" onclick="pickSwatch('+p.id+','+i+')"></button>';
                    }).join('');
                    return '<div class="card"><a class="card-img" href="/product.html?id='+p.id+'">'+(p.badge?'<span class="badge">'+p.badge+'</span>':'')+'<img src="'+v.img+'" alt="'+p.name+'" onerror="this.style.display=\'none\'"></a><div class="card-body"><span style="font-size:0.75rem;color:var(--muted);text-transform:uppercase;">'+p.category+'</span><a class="card-title" href="/product.html?id='+p.id+'">'+p.name+'</a><div style="font-weight:600;">KES '+p.price.toLocaleString()+'</div><div class="swatches">'+sw+'<span style="font-size:0.78rem;color:var(--muted);">'+v.label+'</span></div><div style="margin-top:auto;display:flex;gap:8px;"><button class="btn-secondary" style="flex:1;" onclick="addToCart('+p.id+','+vi+');alert(\'Added to bag!\')">Add to Bag</button><a class="filter-btn" style="text-decoration:none;" href="/product.html?id='+p.id+'">View</a></div></div></div>';
                }).join('');
            }
            renderShop();
        </script>
    </body>
</html>
